<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mökkisavustamo 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- UI Overlay -->
    <div class="relative z-10 pointer-events-none flex flex-col justify-between h-screen p-4 md:p-6">
        
        <!-- Yläpalkki: Tilastot -->
        <header class="flex flex-wrap justify-between items-center bg-stone-900/80 backdrop-blur-md p-4 rounded-2xl border border-stone-700 pointer-events-auto shadow-xl max-w-4xl mx-auto w-full">
            <div>
                <h1 class="text-xl font-bold tracking-wide text-amber-400 flex items-center gap-2">
                    🔥 Mökkisavustamo 3D
                </h1>
                <p class="text-xs text-stone-400">Hallitse lämpöä, savua ja puulajeja</p>
            </div>
            <div class="flex gap-4 md:gap-8 mt-2 md:mt-0 text-sm">
                <div class="bg-stone-800 px-3 py-1.5 rounded-xl border border-stone-700">
                    <span class="text-stone-400 block text-xs">Tuote:</span>
                    <span id="ui-product" class="font-semibold text-amber-200">Ei tuotetta</span>
                </div>
                <div class="bg-stone-800 px-3 py-1.5 rounded-xl border border-stone-700">
                    <span class="text-stone-400 block text-xs">Kypsyys:</span>
                    <span id="ui-readiness" class="font-semibold">0 %</span>
                </div>
                <div class="bg-stone-800 px-3 py-1.5 rounded-xl border border-stone-700">
                    <span class="text-stone-400 block text-xs">Lämpötila:</span>
                    <span id="ui-temp" class="font-semibold text-orange-400">20 °C</span>
                </div>
            </div>
        </header>

        <!-- Keskialue: Viestit / Vinkit -->
        <div id="notification" class="self-center bg-stone-900/90 border border-amber-500/50 text-amber-200 px-6 py-2 rounded-full text-sm font-medium shadow-lg transition-opacity duration-300 pointer-events-auto">
            Valitse tuote ja aloita savustus lisäämällä puita pesään!
        </div>

        <!-- Alapalkki: Hallinta ja Toiminnot -->
        <footer class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-4xl mx-auto w-full">
            
            <!-- Raaka-aineet -->
            <div class="bg-stone-900/80 backdrop-blur-md p-4 rounded-2xl border border-stone-700 pointer-events-auto shadow-xl flex flex-col gap-2">
                <span class="text-xs font-bold uppercase tracking-wider text-stone-400">1. Valitse tuote</span>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="selectProduct('lohifilee')" class="bg-amber-700/60 hover:bg-amber-600 border border-amber-500/40 text-xs py-2 px-3 rounded-xl font-medium transition cursor-pointer">🐟 Lohifilee</button>
                    <button onclick="selectProduct('porsaankylki')" class="bg-amber-800/60 hover:bg-amber-700 border border-amber-600/40 text-xs py-2 px-3 rounded-xl font-medium transition cursor-pointer">🥩 Porsaankylki</button>
                </div>
            </div>

            <!-- Puulajit ja Tuli -->
            <div class="bg-stone-900/80 backdrop-blur-md p-4 rounded-2xl border border-stone-700 pointer-events-auto shadow-xl flex flex-col gap-2">
                <span class="text-xs font-bold uppercase tracking-wider text-stone-400">2. Lisää puuta pesään</span>
                <div class="grid grid-cols-3 gap-1.5">
                    <button onclick="addWood('leppä')" class="bg-stone-800 hover:bg-stone-700 border border-stone-600 text-xs py-2 px-2 rounded-xl font-medium transition cursor-pointer">🪵 Leppä</button>
                    <button onclick="addWood('omena')" class="bg-stone-800 hover:bg-stone-700 border border-stone-600 text-xs py-2 px-2 rounded-xl font-medium transition cursor-pointer">🍎 Omena</button>
                    <button onclick="addWood('kataja')" class="bg-stone-800 hover:bg-stone-700 border border-stone-600 text-xs py-2 px-2 rounded-xl font-medium transition cursor-pointer">🌲 Kataja</button>
                </div>
            </div>

            <!-- Pöntön hallinta -->
            <div class="bg-stone-900/80 backdrop-blur-md p-4 rounded-2xl border border-stone-700 pointer-events-auto shadow-xl flex flex-col gap-2">
                <span class="text-xs font-bold uppercase tracking-wider text-stone-400">3. Toiminnot</span>
                <div class="flex gap-2">
                    <button onclick="toggleSmokerDoor()" id="door-btn" class="flex-1 bg-stone-800 hover:bg-stone-700 border border-stone-600 text-xs py-2 px-3 rounded-xl font-medium transition cursor-pointer">🚪 Avaa luukku</button>
                    <button onclick="harvestProduct()" class="flex-1 bg-emerald-800/80 hover:bg-emerald-700 border border-emerald-600/50 text-xs py-2 px-3 rounded-xl font-medium transition cursor-pointer">✨ Nosta pois</button>
                </div>
            </div>

        </footer>

    </div>

    <!-- Pelilogiikka -->
    <script>
        // Peli muuttujat
        let gameState = {
            product: null,      // 'lohifilee', 'porsaankylki'
            readiness: 0,       // 0 - 100%
            temperature: 20,    // °C
            targetTemp: 90,     // Ihanne lämpö
            woodAmount: 0,      // Puun määrä pesässä
            woodType: 'leppä',
            doorOpen: false,
            isReady: false
        };

        // Three.js perusasetukset
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e222a);
        scene.fog = new THREE.FogExp2(0x1e222a, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 7);
        camera.lookAt(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Valot
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Maasto (Nurmikko / Piha)
        const groundGeo = new THREE.PlaneGeometry(30, 30);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d3a2e, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Savustin (Low-Poly Pönttö)
        const smokerGroup = new THREE.Group();
        
        // Päärunko
        const bodyGeo = new THREE.CylinderGeometry(0.8, 0.9, 2.2, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3d444b, metalness: 0.4, roughness: 0.6 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.1;
        body.castShadow = true;
        body.receiveShadow = true;
        smokerGroup.add(body);

        // Savustimen jalat
        for(let i=0; i<3; i++) {
            const legGeo = new THREE.CylinderGeometry(0.06, 0.04, 0.8, 6);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const leg = new THREE.Mesh(legGeo, legMat);
            const angle = (i / 3) * Math.PI * 2;
            leg.position.set(Math.cos(angle)*0.6, 0.4, Math.sin(angle)*0.6);
            leg.rotation.z = Math.cos(angle) * 0.2;
            leg.rotation.x = -Math.sin(angle) * 0.2;
            smokerGroup.add(leg);
        }

        // Savupiippu
        const pipeGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.6, 8);
        const pipe = new THREE.Mesh(pipeGeo, bodyMat);
        pipe.position.set(0, 2.4, 0);
        smokerGroup.add(pipe);

        scene.add(smokerGroup);

        // Puupino taustalle
        const woodPileGroup = new THREE.Group();
        for(let x=0; x<3; x++) {
            for(let y=0; y<2; y++) {
                const logGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.2, 6);
                const logMat = new THREE.MeshStandardMaterial({ color: 0x8a6f47, roughness: 0.8 });
                const log = new THREE.Mesh(logGeo, logMat);
                log.rotation.z = Math.PI / 2;
                log.position.set(-2.5 + x*0.3, 0.2 + y*0.3, -3);
                woodPileGroup.add(log);
            }
        }
        scene.add(woodPileGroup);

        // Savuhiukkaset
        const smokeParticles = [];
        const smokeGeo = new THREE.SphereGeometry(0.15, 6, 6);
        const smokeMat = new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.0 });

        for(let i=0; i<15; i++) {
            const p = new THREE.Mesh(smokeGeo, smokeMat.clone());
            p.position.set(0, 2.7, 0);
            p.visible = false;
            scene.add(p);
            smokeParticles.push(p);
        }

        // Tuote pöntössä (esim. kala / liha malli)
        let productMesh = null;

        function updateProductMesh() {
            if(productMesh) {
                scene.remove(productMesh);
                productMesh = null;
            }
            if(!gameState.product) return;

            if(gameState.product === 'lohifilee') {
                const geo = new THREE.BoxGeometry(0.5, 0.1, 0.8);
                const mat = new THREE.MeshStandardMaterial({ color: 0xd97757, roughness: 0.5 });
                productMesh = new THREE.Mesh(geo, mat);
            } else if(gameState.product === 'porsaankylki') {
                const geo = new THREE.BoxGeometry(0.6, 0.2, 0.6);
                const mat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.6 });
                productMesh = new THREE.Mesh(geo, mat);
            }

            if(productMesh) {
                productMesh.position.set(0, 1.2, 0);
                scene.add(productMesh);
            }
        }

        // Pelin toiminnot
        function selectProduct(type) {
            if(gameState.product) {
                showNotification("Pöntössä on jo tuote! Nosta se ensin pois.");
                return;
            }
            gameState.product = type;
            gameState.readiness = 0;
            gameState.isReady = false;
            updateProductMesh();
            showNotification(`Asetettu savustimeen: ${type === 'lohifilee' ? 'Lohifilee' : 'Porsaankylki'}`);
            updateUI();
        }

        function addWood(type) {
            gameState.woodType = type;
            gameState.woodAmount = Math.min(100, gameState.woodAmount + 30);
            showNotification(`Lisätty ${type}puuta pesään! Savua ja lämpöä nousi.`);
            updateUI();
        }

        function toggleSmokerDoor() {
            gameState.doorOpen = !gameState.doorOpen;
            const btn = document.getElementById('door-btn');
            if(gameState.doorOpen) {
                btn.innerText = "🚪 Sulje luukku";
                btn.classList.add('bg-amber-900/60');
                showNotification("Luukku auki: Lämpö laskee nopeasti.");
            } else {
                btn.innerText = "🚪 Avaa luukku";
                btn.classList.remove('bg-amber-900/60');
                showNotification("Luukku kiinni: Savustin lämpenee.");
            }
        }

        function harvestProduct() {
            if(!gameState.product) {
                showNotification("Ei mitään nostettavaa!");
                return;
            }
            if(gameState.readiness >= 100) {
                showNotification(`Nams! Täydellisesti savustettu ${gameState.product === 'lohifilee' ? 'lohifilee' : 'porsaankylki'}! 😋`);
            } else if(gameState.readiness > 60) {
                showNotification(`Ihan ok tulos, mutta hieman raaka/kesken.`);
            } else {
                showNotification(`Raakaa vielä! Ei tästä nyt savukalaa tullut.`);
            }
            gameState.product = null;
            gameState.readiness = 0;
            gameState.isReady = false;
            updateProductMesh();
            updateUI();
        }

        function showNotification(text) {
            const el = document.getElementById('notification');
            el.innerText = text;
        }

        function updateUI() {
            document.getElementById('ui-product').innerText = gameState.product ? (gameState.product === 'lohifilee' ? 'Lohifilee' : 'Porsaankylki') : 'Ei tuotetta';
            document.getElementById('ui-readiness').innerText = Math.floor(gameState.readiness) + ' %';
            document.getElementById('ui-temp').innerText = Math.floor(gameState.temperature) + ' °C';
        }

        // Pelisilmukka (Ajoitukset ja päivitykset)
        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);

            const delta = (now - lastTime) / 1000;
            lastTime = now;

            // Lämpötilalogiikka
            if(gameState.doorOpen) {
                gameState.temperature = Math.max(20, gameState.temperature - 15 * delta);
                gameState.woodAmount = Math.max(0, gameState.woodAmount - 5 * delta);
            } else {
                if(gameState.woodAmount > 0) {
                    gameState.temperature = Math.min(130, gameState.temperature + 10 * delta);
                    gameState.woodAmount = Math.max(0, gameState.woodAmount - 4 * delta);
                } else {
                    gameState.temperature = Math.max(20, gameState.temperature - 10 * delta);
                }
            }

            // Kypsymislogiikka
            if(gameState.product && gameState.temperature >= 70 && gameState.temperature <= 110) {
                // Ihanne lämpö 80-100
                gameState.readiness = Math.min(100, gameState.readiness + 2 * delta);
            } else if(gameState.product && gameState.temperature > 110) {
                // Liian kuuma -> palaa
                gameState.readiness = Math.min(100, gameState.readiness + 3 * delta);
            }

            // Savuefektin animaatio
            smokeParticles.forEach((p, idx) => {
                if(gameState.woodAmount > 0 && !gameState.doorOpen) {
                    p.visible = true;
                    p.position.y += delta * 1.5;
                    p.position.x += Math.sin(now * 0.003 + idx) * 0.01;
                    p.material.opacity = Math.max(0, 0.6 - (p.position.y - 2.7) * 0.5);

                    if(p.position.y > 4.5) {
                        p.position.set(0, 2.7, 0);
                    }
                } else {
                    p.visible = false;
                }
            });

            // Tuotteen väri muuttuu kypsyyden mukaan
            if(productMesh && productMesh.material) {
                const r = gameState.readiness / 100;
                productMesh.material.color.setRGB(
                    0.85 - r * 0.3,
                    0.45 - r * 0.2,
                    0.34 - r * 0.25
                );
            }

            updateUI();
            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

        // Ikkunan koon muutos
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
