<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mökkisavustamo 3D - Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #0f1115; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .glass { background: rgba(18, 22, 31, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-stone-100 select-none">

<div id="canvas-container" class="absolute inset-0 z-0 cursor-grab active:cursor-grabbing"></div>

<!-- UI -->
<div class="relative z-10 pointer-events-none flex flex-col justify-between h-screen p-4 md:p-6">

    <!-- Yläpalkki -->
    <header class="glass p-4 rounded-2xl pointer-events-auto shadow-2xl max-w-4xl mx-auto w-full flex flex-wrap justify-between items-center">
        <div>
            <h1 class="text-xl font-black tracking-wide text-amber-400 flex items-center gap-2">
                🔥 Mökkisavustamo 3D Pro
            </h1>
            <p class="text-xs text-stone-400">Pyöritä hiirellä kameraa | Säädä savua ja lämpöä</p>
        </div>
        <div class="flex gap-4 mt-2 md:mt-0 text-sm">
            <div class="bg-stone-900/80 px-3 py-1.5 rounded-xl border border-stone-800">
                <span class="text-stone-400 block text-[10px] uppercase font-bold">Tuote</span>
                <span id="ui-product" class="font-semibold text-amber-300">Ei tuotetta</span>
            </div>
            <div class="bg-stone-900/80 px-3 py-1.5 rounded-xl border border-stone-800">
                <span class="text-stone-400 block text-[10px] uppercase font-bold">Kypsyys</span>
                <span id="ui-readiness" class="font-semibold text-emerald-400">0 %</span>
            </div>
            <div class="bg-stone-900/80 px-3 py-1.5 rounded-xl border border-stone-800">
                <span class="text-stone-400 block text-[10px] uppercase font-bold">Lämpötila</span>
                <span id="ui-temp" class="font-semibold text-orange-400">20 °C</span>
            </div>
        </div>
    </header>

    <!-- Viesti -->
    <div id="notification" class="self-center glass border border-amber-500/40 text-amber-200 px-6 py-2.5 rounded-full text-sm font-semibold shadow-2xl transition-all duration-300 pointer-events-auto">
        Aseta lohi tai porsas rilleille ja sytytä pesä!
    </div>

    <!-- Alapalkki -->
    <footer class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-4xl mx-auto w-full pointer-events-auto">

        <div class="glass p-4 rounded-2xl flex flex-col gap-2">
            <span class="text-[10px] font-black uppercase tracking-wider text-amber-400">1. Valitse Raaka-aine</span>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="selectProduct('lohifilee')" class="bg-amber-900/40 hover:bg-amber-800/60 border border-amber-600/40 text-xs py-2.5 px-3 rounded-xl font-bold transition active:scale-95">🐟 Lohifilee</button>
                <button onclick="selectProduct('porsaankylki')" class="bg-red-900/40 hover:bg-red-800/60 border border-red-600/40 text-xs py-2.5 px-3 rounded-xl font-bold transition active:scale-95">🥩 Porsaankylki</button>
            </div>
        </div>

        <div class="glass p-4 rounded-2xl flex flex-col gap-2">
            <span class="text-[10px] font-black uppercase tracking-wider text-amber-400">2. Lisää Puu (Animaatiolla)</span>
            <div class="grid grid-cols-3 gap-1.5">
                <button onclick="addWood('leppä')" class="bg-stone-800/80 hover:bg-stone-700 border border-stone-600/60 text-xs py-2.5 px-1 rounded-xl font-semibold transition active:scale-95">🪵 Leppä</button>
                <button onclick="addWood('omena')" class="bg-stone-800/80 hover:bg-stone-700 border border-stone-600/60 text-xs py-2.5 px-1 rounded-xl font-semibold transition active:scale-95">🍎 Omena</button>
                <button onclick="addWood('kataja')" class="bg-stone-800/80 hover:bg-stone-700 border border-stone-600/60 text-xs py-2.5 px-1 rounded-xl font-semibold transition active:scale-95">🌲 Kataja</button>
            </div>
        </div>

        <div class="glass p-4 rounded-2xl flex flex-col gap-2">
            <span class="text-[10px] font-black uppercase tracking-wider text-amber-400">3. Hallinta</span>
            <div class="flex gap-2">
                <button onclick="toggleSmokerDoor()" id="door-btn" class="flex-1 bg-stone-800/80 hover:bg-stone-700 border border-stone-600/60 text-xs py-2.5 px-3 rounded-xl font-semibold transition active:scale-95">🚪 Avaa luukku</button>
                <button onclick="harvestProduct()" class="flex-1 bg-emerald-800/80 hover:bg-emerald-700 border border-emerald-600/60 text-xs py-2.5 px-3 rounded-xl font-bold transition active:scale-95">✨ Nosta pois</button>
            </div>
        </div>

    </footer>

</div>

<script>
    // Pelin tila
    let gameState = {
        product: null,
        readiness: 0,
        temperature: 20,
        woodAmount: 0,
        woodType: 'leppä',
        doorOpen: false,
        doorAngle: 0
    };

    // Scene, Camera, Renderer
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1117);
    scene.fog = new THREE.FogExp2(0x0e1117, 0.02);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2.5, 2.8, 4.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    // OrbitControls (Kameran pyöritys)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Ei mene maankamaralle
    controls.minDistance = 2;
    controls.maxDistance = 10;
    controls.target.set(0, 1.2, 0);

    // Valaistus
    const ambientLight = new THREE.AmbientLight(0xffeedd, 0.4);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
    sunLight.position.set(6, 12, 8);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    scene.add(sunLight);

    // Pesän hehkuva valo
    const fireLight = new THREE.PointLight(0xff6600, 0, 4);
    fireLight.position.set(0, 0.4, 0.5);
    scene.add(fireLight);

    // Ympäristö
    const groundGeo = new THREE.PlaneGeometry(40, 40);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1b241c, roughness: 0.95 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Realistinen Savustin
    const smokerGroup = new THREE.Group();

    // Savustimen runko
    const bodyGeo = new THREE.CylinderGeometry(0.75, 0.85, 2.0, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x22262c, metalness: 0.7, roughness: 0.4 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    body.castShadow = true;
    body.receiveShadow = true;
    smokerGroup.add(body);

    // Luukku
    const doorPivot = new THREE.Group();
    doorPivot.position.set(-0.7, 0.5, 0.4);

    const doorGeo = new THREE.BoxGeometry(0.05, 0.6, 0.6);
    const doorMat = new THREE.MeshStandardMaterial({ color: 0
